<text class="lbl" x="640" y="680" text-anchor="start">queued in the database</text>
<path class="edge" d="M800 726 V648" marker-end="url(#ar)"/>
<rect class="box " x="20" y="340" width="210" height="520" rx="8"/>
<text class="t" x="36" y="366">data/</text>
<rect class="k-sql" x="162.0" y="351" width="56" height="20" rx="4"/><text class="kt" x="169.0" y="365">SQLite</text>
<text class="m" x="36" y="386">dexstash.db</text>
<text class="ds" x="36" y="404">50 tables, WAL mode</text>
<text class="ds" x="36" y="428">sets · cards · prices</text>
<text class="ds" x="36" y="445">inventory · notes</text>
<text class="ds" x="36" y="462">binders · wants · pulls</text>
<text class="ds" x="36" y="479">purchases · tags</text>
<text class="ds" x="36" y="496">scan_batches · scans</text>
<text class="ds" x="36" y="513">price_snapshots</text>
<text class="ds" x="36" y="530">users · app_meta</text>
<text class="ds" x="36" y="547">jobs · datasets</text>
<text class="ds" x="36" y="564">+ catalog: 15 tables</text>
<text class="m" x="36" y="600">backups/</text>
<text class="m" x="36" y="618">scans/ · card-photos/</text>
<text class="m" x="36" y="636">card-pictures/</text>
<text class="m" x="36" y="654">models/ · index/</text>
<text class="m" x="36" y="672">sprites/ · pokeapi/</text>
<text class="m" x="36" y="690">bulbapedia/ · logs/</text>
<text class="m" x="36" y="708">secret_key · api_keys.json</text>
<text class="ds" x="36" y="740">Shared by both</text>
<text class="ds" x="36" y="756">containers.</text>
<text class="ds" x="36" y="780">Back it up with .env:</text>
<text class="ds" x="36" y="796">it is everything the</text>
<text class="ds" x="36" y="812">app knows.</text>
