<path class="edge" d="M1015 596 V357 H1038" marker-end="url(#ar)"/>
<path class="edge" d="M1015 596 V526 H1038" marker-end="url(#ar)"/>
<text class="ds" x="1040" y="634">Hosts each source uses are listed in the</text>
<text class="ds" x="1040" y="650">README under “Where data comes from”.</text>
<text class="ds" x="20" y="900">Solid boxes run on your server; dashed boxes are on the internet. Orange boxes are switches.</text>
<text class="ds" x="20" y="918">Colours mark each part&#x27;s language: blue Python, orange HTML and Jinja, yellow JavaScript and htmx, teal SQL, purple configuration.</text>
