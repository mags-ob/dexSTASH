<rect class="k-py" x="867.0" y="67" width="56" height="20" rx="4"/><text class="kt" x="874.0" y="81">Python</text>
<text class="m" x="286" y="102">app/main.py</text>
<text class="ds" x="286" y="120">start-up and shutdown, middleware</text>
