<text class="lbl" x="978" y="162" text-anchor="end">3</text>
<text class="ds" x="520" y="220">65 templates in app/templates/ · app/static/ (CSS, JS, htmx, font, logo)</text>
<text class="ds" x="520" y="238">Each module has its own APIRouter; app/main.py includes them all.</text>
<path class="edge" d="M630 252 V270" marker-end="url(#ar)"/>
<rect class="box " x="270" y="272" width="232" height="114" rx="8"/>
<text class="t2" x="286" y="298">Collection</text>
<text class="ds" x="286" y="320">inventory · catalog · numbers</text>
<text class="ds" x="286" y="337">collection · binders · shared</text>
<text class="ds" x="286" y="354">chase · wants · notes · tags</text>
<text class="ds" x="286" y="371">spending · value · home · smart</text>
<rect class="box " x="514" y="272" width="232" height="114" rx="8"/>
<text class="t2" x="530" y="298">Find</text>
<text class="ds" x="530" y="320">search · describe · names</text>
<text class="ds" x="530" y="337">spelling · looks_like · evolution</text>
<text class="ds" x="530" y="354">handmade · pokeapi · display</text>
<text class="ds" x="530" y="371">region · pokemon_words · card_index</text>
<rect class="box " x="758" y="272" width="232" height="114" rx="8"/>
<text class="t2" x="774" y="298">Prices and links</text>
<text class="ds" x="774" y="320">prices (one rule) · sync (nightly)</text>
<text class="ds" x="774" y="337">tcgcsv · cardtrader · pricecharting</text>
<text class="ds" x="774" y="354">fx (currency) · keys (API keys)</text>
<text class="ds" x="774" y="371">extras (your links)</text>
<rect class="box " x="270" y="396" width="232" height="114" rx="8"/>
<text class="t2" x="286" y="422">Pictures and themes</text>
<text class="ds" x="286" y="444">card_pictures · pictures (CLIP)</text>
<text class="ds" x="286" y="461">themes · icons</text>
<text class="ds" x="286" y="478">scans · scanner (queue)</text>
<text class="ds" x="286" y="495"></text>
<rect class="box " x="514" y="396" width="232" height="114" rx="8"/>
<text class="t2" x="530" y="422">Data and import</text>
<text class="ds" x="530" y="444">tcgdex · chinese · bulbapedia</text>
<text class="ds" x="530" y="461">importer · collectr</text>
<text class="ds" x="530" y="478"></text>
<text class="ds" x="530" y="495"></text>
<rect class="box " x="758" y="396" width="232" height="114" rx="8"/>
<text class="t2" x="774" y="422">Platform</text>
<text class="ds" x="774" y="444">db (numbered steps) · auth</text>
<text class="ds" x="774" y="461">backup · reset · settings</text>
<text class="ds" x="774" y="478">activity (log) · recent</text>
<text class="ds" x="774" y="495">welcome (first-run wizard)</text>
<text class="ds" x="270" y="532">72 Python modules in app/, each taking a database connection</text>
<rect class="box " x="270" y="546" width="476" height="100" rx="8"/>
<text class="t2" x="286" y="572">Job runner · app/jobs.py · one job at a time</text>
<rect class="k-py" x="678.0" y="557" width="56" height="20" rx="4"/><text class="kt" x="685.0" y="571">Python</text>
<text class="ds" x="286" y="594">PriceUpdater + Nightly: prices, new sets, backup</text>
<text class="ds" x="286" y="612">Checker: saved pictures · Matcher: Collectr</text>
<text class="ds" x="286" y="630">Downloads and card catalog fetch; pages come first</text>
<rect class="box hot" x="758" y="546" width="232" height="100" rx="8"/>
<text class="t2" x="774" y="572">app/sites.py</text>
<text class="ds" x="774" y="594">One User-Agent:</text>
<text class="ds" x="774" y="612">dexSTASH/&lt;version&gt; (+repo)</text>
<text class="ds" x="774" y="630">refuses switched-off sites</text>
<rect class="ctr" x="250" y="690" width="760" height="170" rx="12"/>
<text class="t" x="268" y="718">Container “dexstash-scanner” · low priority</text>
<text class="lbl" x="994" y="718" text-anchor="end">python -m app.scan_worker</text>
<rect class="box " x="270" y="726" width="232" height="118" rx="8"/>
<text class="t2" x="286" y="752">scans.Worker</text>
<rect class="k-py" x="448.0" y="737" width="42" height="20" rx="4"/><text class="kt" x="455.0" y="751">ONNX</text>
<text class="ds" x="286" y="774">RapidOCR reads name,</text>
<text class="ds" x="286" y="792">set code and number;</text>
<text class="ds" x="286" y="810">matches to a card</text>
<rect class="box " x="514" y="726" width="232" height="118" rx="8"/>
<text class="t2" x="530" y="752">scans.PictureWorker</text>
<rect class="k-py" x="692.0" y="737" width="42" height="20" rx="4"/><text class="kt" x="699.0" y="751">ONNX</text>
<text class="ds" x="530" y="774">Enhanced Search: CLIP</text>
<text class="ds" x="530" y="792">fingerprints, 8 closest</text>
<text class="ds" x="530" y="810">in every language</text>
<rect class="box " x="758" y="726" width="232" height="118" rx="8"/>
<text class="t2" x="774" y="752">LookupWorker + jobs</text>
<text class="ds" x="774" y="774">Picture lookups,</text>
<text class="ds" x="774" y="792">fingerprint indexes,</text>
<text class="ds" x="774" y="810">followed cards&#x27; art</text>
