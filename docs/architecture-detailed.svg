.k-cfg{fill:var(--cfg-bg)}.k-cfg+text{fill:var(--cfg)}
.k-csv{fill:var(--csv-bg)}.k-csv+text{fill:var(--csv)}
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1400" height="940"/>
<rect class="box " x="20" y="20" width="200" height="170" rx="18"/>
<text class="t" x="36" y="46">Phone browser</text>
<text class="d" x="36" y="68">Jinja pages, htmx forms</text>
<text class="d" x="36" y="86">Camera: live or one photo</text>
<text class="d" x="36" y="104">Add to Home Screen</text>
<text class="d" x="36" y="122">Card pictures you don&#x27;t</text>
<text class="d" x="36" y="140">keep load from TCGdex</text>
<path class="edge" d="M120 190 V218" marker-end="url(#ar)"/>
<text class="lbl" x="130" y="209" text-anchor="start">HTTPS</text>
<rect class="box " x="20" y="220" width="200" height="90" rx="8"/>
<text class="t" x="36" y="246">Reverse proxy</text>
<text class="d" x="36" y="268">HTTPS, request_body 25MB</text>
<text class="d" x="36" y="286">→ dexstash:8000</text>
<rect class="ctr" x="250" y="20" width="760" height="640" rx="12"/>
<text class="t" x="268" y="48">Container “dexstash” · one Uvicorn worker</text>
<text class="lbl" x="994" y="48" text-anchor="end">version 0.29.0</text>
<rect class="box hot" x="270" y="56" width="720" height="196" rx="8"/>
