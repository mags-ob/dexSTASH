<text class="lbl" x="820" y="144" text-anchor="end">11</text>
<text class="m" x="678" y="162">collection.py</text>
<text class="lbl" x="820" y="162" text-anchor="end">9</text>
<text class="m" x="678" y="180">shared.py</text>
<text class="lbl" x="820" y="180" text-anchor="end">9</text>
<text class="m" x="678" y="198">wants.py</text>
<text class="lbl" x="820" y="198" text-anchor="end">9</text>
<text class="m" x="836" y="108">binders.py</text>
<text class="lbl" x="978" y="108" text-anchor="end">6</text>
<text class="m" x="836" y="126">pictures.py</text>
<text class="lbl" x="978" y="126" text-anchor="end">6</text>
<text class="m" x="836" y="144">spending.py</text>
<text class="lbl" x="978" y="144" text-anchor="end">6</text>
