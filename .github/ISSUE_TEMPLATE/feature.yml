name: Feature
description: A new capability or change in behaviour
labels: ["feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <role>, I want <goal>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Each one testable.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: UI/UX (wireframe or "no screen changes") and development plan. Filled in during Define.
