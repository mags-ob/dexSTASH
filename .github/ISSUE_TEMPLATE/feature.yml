name: Feature
description: A new capability or change in behaviour
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        One change per issue. Write it for anyone running dexSTASH: no server names, addresses or other personal
        details.
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <role>, I want <goal>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Each one testable.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: 'Short, for people: changes (now and after), UI/UX (wireframe or "UI/UX: no screen changes"), development plan and Docs impact. Detail goes in a linked plan file in docs/plans/. Filled in during Define.'
