name: Bug
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, don't open an issue: see .github/SECURITY.md. Leave out server names, addresses,
        passwords, keys and anything else personal, including in screenshots and logs.
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Account › About shows it.
      placeholder: 0.29.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone, Safari, added to Home Screen
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From `docker compose logs app`, with anything personal removed.
      render: text
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Optional for reporters. The maintainer or an assistant fills this in during Define.
