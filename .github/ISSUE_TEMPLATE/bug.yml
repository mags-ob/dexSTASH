name: Bug
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Optional for reporters. The maintainer or an assistant fills this in during Define.
