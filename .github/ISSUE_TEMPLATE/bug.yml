name: Bug
description: Something dexSTASH does wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, don't open an issue: see SECURITY.md. Leave out server names, addresses,
        passwords, keys and anything else personal, including in screenshots and logs.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      placeholder: |
        1. Open ...
        2. Tap ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Account › About shows it.
      placeholder: 0.29.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone, Safari, added to Home Screen
  - type: dropdown
    id: area
    attributes:
      label: Part of the app
      multiple: true
      options:
        - scanning
        - prices
        - collection (My Stash)
        - binders
        - chases
        - sets and search
        - sharing
        - accounts and setup
        - data model
        - data sources
        - design system
        - deploy
        - not sure
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From `docker compose logs app`, with anything personal removed.
      render: text
