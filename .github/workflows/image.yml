# When a GitHub Release is published (its tag like v0.29.0), builds the Docker image for amd64 and arm64 and
# attaches each to the Release as an image file (dexstash-<version>-amd64.tar.gz), which a host loads with
# `docker load` (DEPLOY.md › Using a release image). Nothing is published unless the tests pass and the tag
# matches the app's version. Test images for pull requests come from pr-image.yml.
name: Image

on:
  release:
    types: [published]

permissions:
  contents: write   # to attach the image files to the Release

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  image:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: The tag matches the app's version
        run: |
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('app/__init__.py').read()).group(1))")
          test "v$version" = "$TAG" || { echo "Tag $TAG but app/__init__.py says $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: dexstash:${{ steps.version.outputs.version }}
          outputs: type=docker,dest=dexstash.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Attach the image file to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="dexstash-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz"
          gzip -c dexstash.tar > "$file"
          sha256sum "$file" > "$file.sha256"
          gh release upload "$TAG" "$file" "$file.sha256" --clobber
