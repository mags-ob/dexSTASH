# When a GitHub Release is published (its tag like v0.29.0), builds the Docker image for amd64 and arm64:
# - attaches each to the Release as an image file (dexstash-<version>-amd64.tar.gz) for `docker load`;
# - pushes it to ghcr.io/<owner>/dexstash as <version>, <major.minor> and latest (not latest for a pre-release)
#   for `docker compose pull` (DEPLOY.md › Using a release image).
# Nothing is published unless the tests pass and the tag matches the app's version.
# Actions › Image › Run workflow builds an existing release tag again.
name: Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, like v0.28.0"
        required: true

permissions:
  contents: write   # to attach the image files to the Release

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  LATEST: ${{ !github.event.release.prerelease }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: version
        name: The tag matches the app's version
        run: |
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('app/__init__.py').read()).group(1))")
          test "v$version" = "$TAG" || { echo "Tag $TAG but app/__init__.py says $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

  image:
    needs: [tests, version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: name
        name: Image name, as in docker-compose.yml (registry names are lower case)
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dexstash" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.name.outputs.image }}:${{ needs.version.outputs.version }}
          outputs: type=docker,dest=dexstash.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Attach the image file to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="dexstash-${{ needs.version.outputs.version }}-${{ matrix.arch }}.tar.gz"
          gzip -c dexstash.tar > "$file"
          sha256sum "$file" > "$file.sha256"
          gh release upload "$TAG" "$file" "$file.sha256" --clobber --repo "$GITHUB_REPOSITORY"

  registry:
    needs: [tests, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: name
        name: Image name (registry names are lower case)
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dexstash" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.minor }}
            type=raw,value=latest,enable=${{ env.LATEST }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
