# The checks that hold the rules in rules/core.md and rules/project.md, next to the test suite (tests.yml).
# They run on every push and pull request, and when started by hand (Actions > Checks > Run workflow).
# Each job is its own check on a pull request, so a failure says which rule it was.
name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, edited]  # edited: the spec check reads the description
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.4
      - run: ruff check --output-format github .

  rules:
    name: Core rules and spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the spec check compares the pull request with its base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Personal details, files never committed, and the spec rule
        env:
          # Comma-separated words that must never appear (names, server names, domains). It is a repository
          # secret, set under Settings > Secrets and variables > Actions, so the list itself stays private.
          DEXSTASH_PRIVATE_WORDS: ${{ secrets.DEXSTASH_PRIVATE_WORDS }}
        run: python tools/check_rules.py --spec

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every commit, not just the last one
      - name: Install gitleaks 8.28.0
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan the history
        run: ./gitleaks git --no-banner --redact --verbose .

  dependencies:
    name: Dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - name: Known vulnerabilities in the pinned packages
        run: pip-audit --requirement requirements.lock --progress-spinner off
