# The test suite: on pushes to main, on pull requests, when started by hand
# (Actions > Tests > Run workflow), and before a release image is built (image.yml calls it).
# A pull request that only changes files no test reads (specs, rules, assistant notes, templates) skips it.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/specs/**"
      - "rules/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request stops its older run. Runs on main and before a release always finish.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4  # round 15a: the inline-script checks parse with Node and fail without it
        with:
          node-version: "22"
      - name: System libraries for the photo reader
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: pip install -r requirements.lock pytest==9.1.1
      - name: Tests
        run: python -m pytest -q
