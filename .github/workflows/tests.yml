# The test suite: on every push, on pull requests, when started by hand
# (Actions > Tests > Run workflow), and before a release image is built (image.yml calls it).
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4  # round 15a: the inline-script checks parse with Node and fail without it
        with:
          node-version: "22"
      - name: System libraries for the photo reader
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: pip install -r requirements.lock pytest==9.1.1
      - name: Tests
        run: python -m pytest -q
