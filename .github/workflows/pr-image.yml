# A test image for every pull request: ghcr.io/<owner>/dexstash:pr-<number>, for amd64 and arm64, rebuilt on
# each push to the pull request, so a host can try the change before it is merged (DEPLOY.md › Trying a pull
# request). The image is removed when the pull request closes. Release images come from image.yml.
# Pull requests from forks build nothing here: GitHub gives them no right to write packages.
name: Test image

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  packages: write

concurrency:
  group: test-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dexstash
          tags: type=ref,event=pr   # pr-<number>
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: How to try it
        run: |
          {
            echo "### Test image"
            echo "In \`.env\` on your server:"
            echo '```'
            echo "DEXSTASH_IMAGE=${{ steps.meta.outputs.tags }}"
            echo "DEXSTASH_PULL_POLICY=always"
            echo '```'
            echo "then \`docker compose up -d\`. A pull request with a database step upgrades your database: see DEPLOY.md › Trying a pull request."
          } >> "$GITHUB_STEP_SUMMARY"

  remove:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Remove pr-${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          # A package lives under /orgs/ or /users/, depending on who owns the repository.
          if [ "$(gh api "users/$owner" --jq .type)" = "Organization" ]; then base="orgs/$owner"; else base="users/$owner"; fi
          if ! ids=$(gh api --paginate "$base/packages/container/dexstash/versions" \
                       --jq ".[] | select(.metadata.container.tags | index(\"$TAG\")) | .id"); then
            echo "::warning::Couldn't list the images, so $TAG wasn't removed. Delete it under the repository's Packages."
            exit 0
          fi
          if [ -z "$ids" ]; then echo "No $TAG image to remove."; exit 0; fi
          for id in $ids; do
            gh api -X DELETE "$base/packages/container/dexstash/versions/$id" \
              && echo "Removed $TAG ($id)." \
              || echo "::warning::Couldn't remove $TAG ($id). Delete it under the repository's Packages."
          done
